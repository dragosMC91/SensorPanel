<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel Designs</title>
  <link rel="icon" href="data:," />
  <!-- Side-by-side comparison of the production panel and the pure-CSS
       alternatives in designs/*. Each tile is a real 1024x600 iframe scaled
       down, so what you see is exactly what the Waveshare would show. -->
  <style>
    :root { --bg: #07080d; --fg: #d8e0ee; --dim: #7a8499; --line: #1d2333; --accent: #7cf3ff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; padding: 16px; }
    header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; margin-bottom: 16px; }
    h1 { font-size: 18px; font-weight: 600; letter-spacing: .5px; }
    .ctl { display: flex; gap: 4px; align-items: center; }
    .ctl span { color: var(--dim); margin-right: 6px; }
    button { background: #11151f; color: var(--fg); border: 1px solid var(--line); border-radius: 6px;
             padding: 5px 10px; font: inherit; cursor: pointer; }
    button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
    .hint { color: var(--dim); font-size: 12px; }
    #grid { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 16px; }
    figure { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #000; }
    figure.focus { grid-column: 1 / -1; }
    figcaption { display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
                 padding: 8px 12px; background: #0c0f17; border-bottom: 1px solid var(--line); }
    figcaption b { font-weight: 600; }
    figcaption em { color: var(--dim); font-style: normal; font-size: 12px; flex: 1; }
    figcaption a, figcaption button { color: var(--accent); font-size: 12px; text-decoration: none;
                                      background: none; border: 0; padding: 0; }
    .frame { position: relative; aspect-ratio: 1024 / 600; overflow: hidden; }
    .frame iframe { position: absolute; left: 0; top: 0; width: 1024px; height: 600px; border: 0;
                    transform-origin: top left; pointer-events: none; }
    .frame .missing { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); }
  </style>
</head>
<body>
  <header>
    <h1>Sensor panel designs</h1>
    <div class="ctl" id="mode"><span>Data</span>
      <button data-mode="" aria-pressed="true">Live</button>
      <button data-mode="load">Load sweep</button>
      <button data-mode="peak">Peak</button>
      <button data-mode="null">Sensors missing</button>
    </div>
    <div class="ctl" id="cols"><span>Columns</span>
      <button data-cols="1">1</button>
      <button data-cols="2" aria-pressed="true">2</button>
      <button data-cols="3">3</button>
    </div>
    <p class="hint">The original always shows live data; demo modes apply to the alternatives only.</p>
  </header>

  <main id="grid"></main>

  <script>
    /* One live stream for every alternative. Chrome caps HTTP/1.1 at six
       connections per host and an EventSource holds one forever, so six tiles
       each streaming would leave nothing for images or /metrics. Framed
       designs pick this up through designs/shared/feed.js; the original keeps
       its own stream, for two connections in total. */
    window.PanelHub = (() => {
      const subs = new Set();
      let last = null, poll = null;
      const emit = (d) => {
        last = d;
        subs.forEach((fn) => { try { fn(d); } catch (e) { subs.delete(fn); } });
      };
      const fetchOnce = async () => {
        try { emit(await (await fetch("/metrics", { cache: "no-store" })).json()); } catch (e) {}
      };
      const connect = () => {
        const sse = new EventSource("/stream");
        sse.onopen = () => { clearInterval(poll); poll = null; };
        sse.onmessage = (ev) => { try { emit(JSON.parse(ev.data)); } catch (e) {} };
        sse.onerror = () => {
          sse.close();
          if (!poll) poll = setInterval(fetchOnce, 1000);
          setTimeout(connect, 5000);
        };
      };
      fetchOnce();
      connect();
      return {
        subscribe(fn) { subs.add(fn); if (last) fn(last); return () => subs.delete(fn); },
      };
    })();

    const DESIGNS = [
      { slug: "",             name: "Original",       note: "Production: Canva background + GIFs" },
      { slug: "holo-hud",     name: "Holo HUD",       note: "Holographic cockpit, ring gauges" },
      { slug: "circuit-core", name: "Circuit Core",   note: "The current look rebuilt in pure CSS" },
      { slug: "glass-core",   name: "Glass Core",     note: "Frosted glass, aurora, big numerals" },
      { slug: "neon-grid",    name: "Neon Grid",      note: "Synthwave horizon, chrome type" },
      { slug: "tactical",     name: "Tactical MFD",   note: "Aerospace display, phosphor amber" },
    ];
    let mode = "";
    const grid = document.getElementById("grid");

    function src(d) {
      if (!d.slug) return "/";
      return `/designs/${d.slug}/index.html` + (mode ? `?demo=${mode}` : "");
    }

    function build() {
      grid.innerHTML = "";
      DESIGNS.forEach((d) => {
        const fig = document.createElement("figure");
        fig.innerHTML = `
          <figcaption><b>${d.name}</b><em>${d.note}</em>
            <button class="zoom">focus</button>
            <a href="${src(d)}" target="_blank">open ↗</a></figcaption>
          <div class="frame"><iframe src="${src(d)}" loading="eager" title="${d.name}"></iframe></div>`;
        fig.querySelector(".zoom").onclick = () => {
          const on = !fig.classList.contains("focus");
          grid.querySelectorAll("figure").forEach((f) => f.classList.remove("focus"));
          fig.classList.toggle("focus", on);
          if (on) fig.scrollIntoView({ behavior: "smooth", block: "start" });
          fit();
        };
        grid.appendChild(fig);
      });
      fit();
    }

    function fit() {
      grid.querySelectorAll(".frame").forEach((f) => {
        f.querySelector("iframe").style.transform = `scale(${f.clientWidth / 1024})`;
      });
    }
    new ResizeObserver(fit).observe(grid);

    function radio(groupId, attr, onPick) {
      const group = document.getElementById(groupId);
      group.addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        group.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b));
        onPick(b.dataset[attr]);
      });
    }
    radio("mode", "mode", (m) => { mode = m; build(); });
    radio("cols", "cols", (c) => { grid.style.setProperty("--cols", c); requestAnimationFrame(fit); });

    build();
  </script>
</body>
</html>
